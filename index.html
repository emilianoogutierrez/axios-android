<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="AXIOS. Tu trading, tus libros y tus notas en un solo lugar. Gratis para Android.">
  <title>AXIOS</title>
  <link rel="icon" href="logo.png">
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000000;color:#f4f3ef}
    *{box-sizing:border-box}body{margin:0}
    .page{min-height:100vh;min-height:100svh;max-width:1120px;margin:auto;padding:36px 40px 24px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:650;letter-spacing:4px}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 0 88px}
    h1{font-size:clamp(44px,7vw,76px);font-weight:600;letter-spacing:-.055em;line-height:1.07;margin:0 0 24px}
    .intro{max-width:340px;margin:0;font-size:17px;line-height:1.65;color:#999997;text-wrap:pretty}
    .download{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 34px;margin-top:36px;border-radius:999px;background:#f4f3ef;color:#121212;text-decoration:none;font-size:15px;font-weight:650;transition:transform .18s ease,background .18s ease}
    .download:hover{background:#deddd8;transform:translateY(-2px)}.download:active{transform:scale(.97)}
    a:focus-visible{outline:2px solid #f4f3ef;outline-offset:6px}
    .meta{font-size:12px;letter-spacing:.02em;color:#777773;margin:16px 0 0}
    footer{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:#777773;line-height:1.5}
    footer a{color:inherit;text-decoration:none;padding:8px 0}footer a:hover{color:#f4f3ef}
    @media(max-width:480px){.page{padding:28px 24px 18px}main{padding:64px 0}.intro{max-width:290px;font-size:16px}h1{font-size:clamp(40px,11.8vw,56px)}.download{min-height:56px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.download:hover,.download:active{transform:none}}
  </style>
</head>
<body>
  <div class="page">
    <header class="brand"><img src="logo.png" width="42" height="42" alt="">AXIOS</header>
    <main>
      <h1>Tu trading.<br>Tu espacio.</h1>
      <p class="intro">Practica con replay. Guarda tus operaciones, tus libros y tus notas.</p>
      <a class="download" href="https://github.com/emilianoogutierrez/axios-android/releases/download/v2.0.1-preview/AXIOS-2.0.1.apk">Descargar gratis</a>
      <p class="meta">Android · 138.8 MB · Sin cuenta</p>
    </main>
    <footer><span>2.0.1 · Versión preliminar</span><a href="licenses.txt">Créditos</a></footer>
  </div>
</body>
</html>
